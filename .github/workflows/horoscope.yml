name: Daily Horoscope Update

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = ~06:00 Chile time
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-horoscope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate horoscopes via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HOROSCOPO }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          chile_tz = timezone(timedelta(hours=-4))
          today = datetime.now(chile_tz).strftime('%Y-%m-%d')

          SIGNS = ["Aries","Tauro","Géminis","Cáncer","Leo","Virgo",
                   "Libra","Escorpio","Sagitario","Capricornio","Acuario","Piscis"]

          sign_schema = {
              "type": "object",
              "properties": {
                  "general":       {"type": "string"},
                  "amor":          {"type": "string"},
                  "trabajo":       {"type": "string"},
                  "salud":         {"type": "string"},
                  "consejo":       {"type": "string"},
                  "numero_suerte": {"type": "integer", "minimum": 1, "maximum": 99},
                  "color_suerte":  {"type": "string"},
                  "energia":       {"type": "integer", "minimum": 1, "maximum": 10}
              },
              "required": ["general","amor","trabajo","salud","consejo","numero_suerte","color_suerte","energia"]
          }

          tool = {
              "name": "guardar_horoscopo",
              "description": "Guarda el horóscopo diario para los 12 signos",
              "input_schema": {
                  "type": "object",
                  "properties": {
                      "fecha": {"type": "string"},
                      "signos": {
                          "type": "object",
                          "properties": {sign: sign_schema for sign in SIGNS},
                          "required": SIGNS
                      }
                  },
                  "required": ["fecha", "signos"]
              }
          }

          prompt = (
              f"Eres un astrólogo experto con 30 años de experiencia. "
              f"Genera el horóscopo del día {today} en español para los 12 signos del zodiaco. "
              "Cada signo debe tener contenido ÚNICO, específico y diferente. "
              "Elemento Fuego (Aries/Leo/Sagitario): energético, apasionado. "
              "Elemento Tierra (Tauro/Virgo/Capricornio): práctico, concreto. "
              "Elemento Aire (Géminis/Libra/Acuario): intelectual, social. "
              "Elemento Agua (Cáncer/Escorpio/Piscis): emocional, intuitivo. "
              "general: 4 oraciones con planeta regente y aspecto astrológico concreto. "
              "amor: 3 oraciones diferenciando solteros y en pareja. "
              "trabajo: 3 oraciones con oportunidades y consejo financiero. "
              "salud: 2 oraciones con consejo de autocuidado. "
              "consejo: 1 frase poderosa y personalizada. "
              "Usa la herramienta guardar_horoscopo para entregar el resultado."
          )

          payload = json.dumps({
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 8192,
              "tools": [tool],
              "tool_choice": {"type": "tool", "name": "guardar_horoscopo"},
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01"
              }
          )

          with urllib.request.urlopen(req) as r:
              res = json.loads(r.read())

          horoscope = next(
              b["input"] for b in res["content"] if b.get("type") == "tool_use"
          )

          os.makedirs("data", exist_ok=True)
          with open("data/horoscope.json", "w", encoding="utf-8") as f:
              json.dump(horoscope, f, ensure_ascii=False, indent=2)

          print(f"Horóscopo generado para {today}")
          PYEOF

      - name: Commit updated horoscope
        run: |
          git config user.name "queque-bot"
          git config user.email "queque-bot@users.noreply.github.com"
          git add data/horoscope.json
          git diff --staged --quiet || git commit -m "chore: horóscopo diario $(date +%Y-%m-%d)"
          git push
