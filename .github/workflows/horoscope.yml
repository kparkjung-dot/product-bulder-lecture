name: Daily Horoscope Update

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = ~06:00 Chile time
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-horoscope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate horoscopes via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HOROSCOPO }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          chile_tz = timezone(timedelta(hours=-4))
          today = datetime.now(chile_tz).strftime('%Y-%m-%d')

          prompt = (
              f"Eres un astrólogo experto con 30 años de experiencia, especializado en astrología occidental moderna. "
              f"Genera el horóscopo del día {today} en español para los 12 signos del zodiaco. "
              "IMPORTANTE: Cada signo debe tener contenido ÚNICO, ESPECÍFICO y DIFERENTE al resto. "
              "Personaliza según el elemento de cada signo: "
              "Fuego (Aries/Leo/Sagitario): energético, apasionado, directo. "
              "Tierra (Tauro/Virgo/Capricornio): práctico, concreto, material. "
              "Aire (Géminis/Libra/Acuario): intelectual, social, comunicativo. "
              "Agua (Cáncer/Escorpio/Piscis): emocional, intuitivo, profundo. "
              "Para CADA signo incluye estos 8 campos: "
              "1) 'general': 4 oraciones. Menciona el planeta regente del signo, describe la energía del día con un aspecto astrológico concreto y cómo afecta a ese signo específicamente. Sé profundo y creíble. "
              "2) 'amor': 3 oraciones. Diferencia entre solteros y en pareja. Consejo romántico específico para la personalidad del signo. "
              "3) 'trabajo': 3 oraciones. Oportunidades laborales, consejo financiero y advertencia si aplica. Concreto y accionable. "
              "4) 'salud': 2 oraciones. Bienestar físico y mental. Un consejo preventivo o de autocuidado específico para el signo. "
              "5) 'consejo': 1 frase poderosa, práctica y personalizada. Que resuene con la esencia del signo. "
              "6) 'numero_suerte': un número entero entre 1 y 99, diferente para cada signo hoy. "
              "7) 'color_suerte': un color en español que potencie la energía del signo hoy (ej: 'Azul cobalto', 'Verde esmeralda'). "
              "8) 'energia': entero del 1 al 10 indicando nivel de energía general del signo hoy. Varía entre signos. "
              "Tono: cálido, profundo, creíble. No uses frases genéricas ni clichés. "
              "Responde ÚNICAMENTE con JSON válido sin texto extra ni markdown:\n"
              '{"fecha": "' + today + '", "signos": {'
              '"Aries": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":7,"color_suerte":"Rojo fuego","energia":8}, '
              '"Tauro": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":14,"color_suerte":"Verde esmeralda","energia":6}, '
              '"Géminis": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":21,"color_suerte":"Amarillo dorado","energia":9}, '
              '"Cáncer": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":3,"color_suerte":"Plateado","energia":7}, '
              '"Leo": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":32,"color_suerte":"Naranja intenso","energia":9}, '
              '"Virgo": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":18,"color_suerte":"Beige dorado","energia":6}, '
              '"Libra": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":9,"color_suerte":"Rosa pálido","energia":7}, '
              '"Escorpio": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":44,"color_suerte":"Granate","energia":8}, '
              '"Sagitario": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":55,"color_suerte":"Púrpura real","energia":9}, '
              '"Capricornio": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":27,"color_suerte":"Marrón tierra","energia":5}, '
              '"Acuario": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":61,"color_suerte":"Azul eléctrico","energia":8}, '
              '"Piscis": {"general":"...","amor":"...","trabajo":"...","salud":"...","consejo":"...","numero_suerte":12,"color_suerte":"Turquesa","energia":7}}}'
          )

          payload = json.dumps({
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 4096,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01"
              }
          )

          with urllib.request.urlopen(req) as r:
              res = json.loads(r.read())

          text = res["content"][0]["text"].strip()
          start = text.find("{")
          end = text.rfind("}") + 1
          horoscope = json.loads(text[start:end])

          os.makedirs("data", exist_ok=True)
          with open("data/horoscope.json", "w", encoding="utf-8") as f:
              json.dump(horoscope, f, ensure_ascii=False, indent=2)

          print(f"Horóscopo generado para {today}")
          PYEOF

      - name: Commit updated horoscope
        run: |
          git config user.name "queque-bot"
          git config user.email "queque-bot@users.noreply.github.com"
          git add data/horoscope.json
          git diff --staged --quiet || git commit -m "chore: horóscopo diario $(date +%Y-%m-%d)"
          git push
