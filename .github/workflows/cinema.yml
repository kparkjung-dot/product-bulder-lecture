name: Weekly Cinema Update

on:
  schedule:
    - cron: '0 14 * * 4'  # Every Thursday at 14:00 UTC (new releases hit Chilean theaters on Thursdays)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cinema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Scrape current cinema listings
        run: |
          python3 << 'PYEOF'
          import json, re
          from datetime import datetime, timezone
          from urllib.request import urlopen, Request
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup

          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          movies = []

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
              'Accept-Language': 'es-CL,es;q=0.9',
          }

          ARTICLES = {'a','an','the','and','or','but','in','of','to','for','with','by','at','on',
                      'from','la','el','los','las','de','del','en','y','e','un','una'}

          def slug_to_title(slug):
              words = slug.replace('-', ' ').split()
              return ' '.join(
                  w if (i > 0 and w.lower() in ARTICLES) else w.capitalize()
                  for i, w in enumerate(words)
              )

          # ── 1. Cinemark via sitemap ──────────────────────────
          print("Scraping Cinemark via sitemap...")
          try:
              req = Request('https://www.cinemark.cl/sitemap.xml', headers=HEADERS)
              with urlopen(req, timeout=15) as r:
                  xml_content = r.read()
              tree = ET.fromstring(xml_content)
              ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
              seen = set()
              for url_el in tree.findall('.//sm:url', ns):
                  loc = url_el.find('sm:loc', ns)
                  if loc is None:
                      continue
                  m = re.search(r'/pelicula/([^/?#]+)', loc.text.strip())
                  if not m:
                      continue
                  slug = m.group(1).strip('/')
                  if slug in seen:
                      continue
                  seen.add(slug)
                  movies.append({'name': slug_to_title(slug), 'emoji': '🎟️', 'platform': 'Cinemark'})
              print(f"  Cinemark: {len(seen)} movies found")
          except Exception as e:
              print(f"  Cinemark failed: {e}")

          # ── 2. Cinépolis Chile (ex-CineHoyts) via HTML parse ─
          # cinehoyts.cl redirects to cinepolischile.cl
          # Movie titles are in static <h2> tags — no JS rendering needed
          print("Scraping Cinépolis Chile (cinepolischile.cl)...")
          try:
              req = Request('https://www.cinepolischile.cl', headers=HEADERS)
              with urlopen(req, timeout=15) as r:
                  html = r.read().decode('utf-8', errors='replace')
              soup = BeautifulSoup(html, 'html.parser')

              cp_seen = set()
              # Movie cards contain /pelicula/ links; grab the h2 in each card
              for a in soup.find_all('a', href=re.compile(r'/pelicula/')):
                  card = a
                  h2 = None
                  for _ in range(6):
                      card = card.parent
                      if not card:
                          break
                      h2 = card.find('h2')
                      if h2:
                          break
                  if h2:
                      title = h2.get_text(separator=' ', strip=True)
                      if 3 < len(title) < 100 and title.upper() not in cp_seen:
                          cp_seen.add(title.upper())
                          movies.append({'name': title.title(), 'emoji': '🎟️', 'platform': 'Cinépolis'})

              # Fallback: just grab all h2s if card approach found nothing
              if not cp_seen:
                  for h2 in soup.find_all('h2'):
                      title = h2.get_text(separator=' ', strip=True)
                      if 3 < len(title) < 80 and title.upper() not in cp_seen:
                          cp_seen.add(title.upper())
                          movies.append({'name': title.title(), 'emoji': '🎟️', 'platform': 'Cinépolis'})

              print(f"  Cinépolis Chile: {len(cp_seen)} movies found")
          except Exception as e:
              print(f"  Cinépolis Chile failed: {e}")

          # ── 3. Save results ──────────────────────────────────
          if not movies:
              print("No movies scraped — keeping existing data unchanged")
              exit(0)

          seen_names = set()
          unique = []
          for m in movies:
              key = m['name'].lower()
              if key not in seen_names:
                  seen_names.add(key)
                  unique.append(m)

          sources = sorted({m['platform'] for m in unique})
          result = {
              'updated_at': today,
              'sources': sources,
              'cartelera': unique,
          }

          with open('data/cinema.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(unique)} movies from {sources}")
          PYEOF

      - name: Commit updated cinema listings
        run: |
          git config user.name "queque-bot"
          git config user.email "queque-bot@users.noreply.github.com"
          git add data/cinema.json
          git diff --staged --quiet || git commit -m "chore: cartelera cines $(date +%Y-%m-%d)"
          git push
